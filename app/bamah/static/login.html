<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bamah</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="login">
  <form id="f">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10a8 8 0 0 1 16 0v10M4 20h16M9 20v-6a3 3 0 0 1 6 0v6"/></svg></div>
    <div class="brand">Bamah</div>
    <input type="password" id="pw" placeholder="Password" aria-label="Password" autocomplete="current-password" autofocus>
    <button class="btn primary" type="submit">Sign in</button>
    <div class="err" id="err" style="margin-top:10px"></div>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', {method: 'POST', headers: {'content-type': 'application/json'},
    body: JSON.stringify({password: document.getElementById('pw').value})});
  if (r.ok) location.href = '/';
  else document.getElementById('err').textContent = 'Wrong password';
});
</script>
</body>
</html>
